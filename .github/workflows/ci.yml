name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: jobs that need more ask for it explicitly.
permissions:
  contents: read

# Cancel superseded runs on PRs, never on main (a release must not be interrupted).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --coverage
      - name: Coveralls
        if: matrix.node == 24
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  # Static analysis of the GitHub Actions workflows (template injection, dangerous triggers, unpinned actions, ...).
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on findings instead of only uploading them to code scanning.
          advanced-security: false

  # Single stable check to mark as "required" in branch protection.
  # `if: always()` is mandatory: a skipped required check counts as a success on GitHub.
  ci-ok:
    if: always()
    needs: [lint, test, build, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: manual approval, main only. Must match the trusted publisher configured on npmjs.com.
    environment: npm-publish
    permissions:
      contents: write # push the release tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance; stage publish only, approved by hand on npm with 2FA
    env:
      # Ephemeral token: semantic-release also uses it to authenticate git when pushing the tag.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No registry-url: it would write an .npmrc expecting NODE_AUTH_TOKEN, which conflicts with OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # semantic-release 26 requires Node >= 26.13
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx semantic-release
